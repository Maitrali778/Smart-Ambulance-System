<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Ambulance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#002b5b;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    width:50%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#002b5b;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    background:#d40000;
    color:white;
    border:none;
    padding:15px;
    margin-top:25px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#b00000;
}

.back-btn{
    background:#002b5b;
}

.city-container,
.type-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:nowrap;
    overflow-x:auto;
    margin:25px 0;
}

.city-card,
.type-card{
    width:110px;
    min-width:110px;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    cursor:pointer;
    transition:.3s;
    text-align:center;
}


.city-card img,
.type-card img{
    width:100%;
    height:70px;
    object-fit:cover;
    display:block;
}

.city-card h3,
.type-card h3{
    padding:8px;
    font-size:15px;
    color:#002b5b;
}

.city-card:hover,
.type-card:hover{
    transform:translateY(-5px);
}

</style>

</head>
<body>

<header>
    <h1>🚑 Ambulance Request Form</h1>
</header>

<div class="container">
    <h2>Select Your City</h2>

<div class="city-container">

<div class="city-card" onclick="selectCity(this,'Mumbai')">
    <img src="{{ url_for('static', filename='mumbai.png') }}">
    <h3>Mumbai</h3>
</div>

<div class="city-card" onclick="selectCity(this,'Pune')">
    <img src="{{ url_for('static', filename='pune.png') }}">
    <h3>Pune</h3>
</div>

<div class="city-card" onclick="selectCity(this,'Delhi')">
    <img src="{{ url_for('static', filename='delhi.png') }}">
    <h3>Delhi</h3>
</div>

<div class="city-card" onclick="selectCity(this,'Bangalore')">
    <img src="{{ url_for('static', filename='bangalore.png') }}">
    <h3>Bangalore</h3>
</div>

<div class="city-card" onclick="selectCity(this,'Hyderabad')">
    <img src="{{ url_for('static', filename='hyderabad.png') }}">
    <h3>Hyderabad</h3>
</div>

</div>
<h2>Select Ambulance Type</h2>

<div class="type-container">

<div class="type-card" onclick="selectAmbulance(this,'Basic Ambulance')">
<img src="{{ url_for('static', filename='basic.png') }}">
<h3>Basic</h3>
</div>

<div class="type-card" onclick="selectAmbulance(this,'ICU Ambulance')">
<img src="{{ url_for('static', filename='icu.png') }}">
<h3>ICU</h3>
</div>

<div class="type-card" onclick="selectAmbulance(this,'Boat Ambulance')">
<img src="{{ url_for('static', filename='boat.png') }}">
<h3>Boat</h3>
</div>

<div class="type-card" onclick="selectAmbulance(this,'Air Ambulance')">
<img src="{{ url_for('static', filename='air.png') }}">
<h3>Air</h3>
</div>

</div>

<h2>Request Ambulance</h2>

<form action="{{ url_for('success') }}">

<label>Selected City</label>
<input type="text" id="selectedCity" readonly>

<label>Selected Ambulance</label>
<input type="text" id="selectedAmbulance" readonly>

<label>Patient Name</label>
<input type="text" placeholder="Enter Patient Name" required>

<label>Mobile Number</label>
<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number"
required
maxlength="10"
pattern="[0-9]{10}"
inputmode="numeric"
oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">

<label>Pickup Location</label>
<textarea rows="3"
          placeholder="Enter Address"
          required></textarea>

<label>Emergency Type</label>

<select required>
    <option value="">Select Emergency Type</option>
    <option>Accident</option>
    <option>Heart Attack</option>
    <option>Pregnancy Emergency</option>
    <option>General Emergency</option>
</select>

<label>Hospital Preference</label>
<input type="text"
       placeholder="Preferred Hospital"
       required>

<button type="submit">
Submit Request
</button>

</form>
<script>
document.querySelector("form").addEventListener("submit", function () {

    const mobile = document.querySelector('input[type="tel"]').value;

    localStorage.setItem("patientMobile", mobile);

});
</script>

<br>

<a href="{{ url_for('home') }}">
    <button class="back-btn">
        Back To Home
    </button>
</a>

</div>
<script>

function selectCity(card, city){

document.querySelectorAll(".city-card").forEach(c=>{
c.classList.remove("active");
});

card.classList.add("active");

document.getElementById("selectedCity").value=city;

}

function selectAmbulance(card,type){

document.querySelectorAll(".type-card").forEach(c=>{
c.classList.remove("active");
});

card.classList.add("active");

document.getElementById("selectedAmbulance").value=type;

}

</script>
</body>
</html>
