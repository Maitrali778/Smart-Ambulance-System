<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Submitted</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    width:550px;
}

.ambulance-img{
    width:120px;
    margin-bottom:10px;
}

.check{
    margin:20px 0;
}

.check img{
    width:80px;
    height:80px;
    object-fit:contain;
}

h1{
    color:#008000;
    margin-top:15px;
}

p{
    margin-top:15px;
    color:#555;
    line-height:1.6;
    font-size:18px;
}

.request-id{
    margin-top:15px;
    color:#002b5b;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:25px;
    background:#002b5b;
    color:white;
    padding:15px 30px;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}

.btn:hover{
    background:#001a36;
}

</style>

</head>

<body>

<div class="container">


<div class="check">
    <img src="success.png" alt="Success">
</div>

<h1>Request Submitted Successfully!</h1>

<p>
Your ambulance request has been received successfully.
Our emergency team is reviewing your request and will contact you shortly.
</p>

<p class="request-id">
Reference No: #AMB001
</p>

<a href="index.html" class="btn">
Back To Home
</a>

</div>

</body>
</html>
