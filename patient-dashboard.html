<script>

<script>

function cancelBooking() {
    let confirmCancel = confirm("Do you really want to cancel the booking?");

    if (confirmCancel) {
        alert("Your Ambulance booking has been cancelled successfully.");

        document.querySelector(".status").innerText = "Cancelled";

    }

// 🚑 TRACK AMBULANCE FUNCTION (ADD THIS)
function trackAmbulance() {
    let statusCard = document.querySelector(".card h2");

    statusCard.innerText = "Tracking Live 🚑";
    statusCard.style.color = "#007bff";

    alert("Ambulance tracking started!");
}

</script>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
<script>let map;
let marker;

let moveLat = 0.0002;
let moveLng = 0.0002;

function startTracking() {

    document.getElementById("map").style.display = "block";

    navigator.geolocation.watchPosition((position) => {

        let lat = position.coords.latitude;
        let lng = position.coords.longitude;

        // map init only once
        if (!map) {
            map = L.map('map').setView([lat, lng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            let ambulanceIcon = L.icon({
    iconUrl: "track.png",
    iconSize: [45, 45],
    iconAnchor: [22, 22]
});

            marker = L.marker([lat, lng], { icon: ambulanceIcon }).addTo(map);
            setInterval(() => {

    lat += moveLat;
    lng += moveLng;

    marker.setLatLng([lat, lng]);
    map.panTo([lat, lng]);

}, 1500);
        }

        // live movement
        marker.setLatLng([lat, lng]);
        map.setView([lat, lng]);

        console.log("Live Location:", lat, lng);

    }, (error) => {
        alert("Location access denied");
    });

    alert("🚑 Live Tracking Started");
}</script>
<script>setInterval(() => {
    let el = document.getElementById("trackingStatus");
    if (el) {
        el.style.opacity = el.style.opacity === "0" ? "1" : "0";
    }
}, 500)</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>setInterval(() => {

    let live = document.getElementById("liveStatus");

    if (live.style.visibility === "hidden") {
        live.style.visibility = "visible";
    } else {
        live.style.visibility = "hidden";
    }

}, 500);</script>
<script>let time = 8;

setInterval(() => {

    if (time > 1) {
        time--;
        document.getElementById("eta").innerHTML =
            "Estimated Arrival : " + time + " Minutes";
    } else {
        document.getElementById("eta").innerHTML =
            "🚑 Ambulance has arrived!";
    }

}, 5000);</script>

    iconUrl: "track.png",

});

marker = L.marker([lat, lng], { icon: ambulanceIcon }).addTo(map);</script>
