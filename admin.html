<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#002b5b;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
margin:30px auto;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#e63946;
margin-bottom:10px;
}

.card p{
font-size:18px;
color:#555;
}

table{
width:100%;
margin-top:40px;
border-collapse:collapse;
background:white;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

table th{
background:#002b5b;
color:white;
padding:15px;
}

table td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

.status1{
color:green;
font-weight:bold;
}

.status2{
color:orange;
font-weight:bold;
}

.status3{
color:red;
font-weight:bold;
}

.back{
display:inline-block;
margin-top:30px;
background:#e63946;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:8px;
}

.back:hover{
background:#c82333;
}

@media(max-width:768px){

.cards{
grid-template-columns:1fr;
}

table{
font-size:14px;
}

}

</style>

</head>

<body>

<header>
Admin Dashboard
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>25</h2>
<p>Total Requests</p>
</div>

<div class="card">
<h2>8</h2>
<p>Available Ambulances</p>
</div>

<div class="card">
<h2>3</h2>
<p>Busy Ambulances</p>
</div>

<div class="card">
<h2>12</h2>
<p>Connected Hospitals</p>
</div>

</div>

<table>

<tr>
<th>Patient</th>
<th>Emergency</th>
<th>Ambulance</th>
<th>Status</th>
</tr>

<tr>
<td>Rahul Sharma</td>
<td>Accident</td>
<td>A101</td>
<td class="status2">On The Way</td>
</tr>

<tr>
<td>Priya Patel</td>
<td>Heart Attack</td>
<td>A102</td>
<td class="status1">Completed</td>
</tr>

<tr>
<td>Amit Verma</td>
<td>Pregnancy</td>
<td>A103</td>
<td class="status3">Pending</td>
</tr>

</table>

<a href="{{ url_for('home') }}" class="back">
⬅ Back To Home
</a>

</div>

</body>
</html>
